name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Store submission rules
        run: bun scripts/check-agent-plugin.ts
      - name: Claude plugin and marketplace manifests
        run: |
          bunx @anthropic-ai/claude-code@2.1.292 plugin validate --strict ./.claude-plugin/plugin.json
          bunx @anthropic-ai/claude-code@2.1.292 plugin validate --strict ./.claude-plugin/marketplace.json
